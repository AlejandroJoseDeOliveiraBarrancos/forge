services:
  ollama-qwen:
    image: ollama/ollama:latest
    container_name: forge-ollama-qwen
    profiles: ["models", "qwen"]
    volumes:
      - ollama-qwen:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_GPU_LAYERS=${OLLAMA_QWEN_GPU_LAYERS:-35}
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=${OLLAMA_QWEN_NUM_PARALLEL:-1}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_QWEN_FLASH_ATTENTION:-true}
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_QWEN_KV_CACHE_TYPE:-q4_0}
    ports:
      - "${OLLAMA_QWEN_PORT:-11434}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped